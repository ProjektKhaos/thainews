# Scoped additions for the existing thainews HTTPS virtual host.
<Directory /var/www/abergonline/thainews/ch>
    DirectoryIndex public.php index.html index.php
    php_admin_flag display_errors Off
    php_admin_value upload_max_filesize 8M
    php_admin_value post_max_size 10M
    php_admin_value memory_limit 256M
</Directory>
RewriteEngine On
RewriteRule ^/?ch/(?:index\.html)?$ /ch/public.php [END]
<LocationMatch "(?i)^/ch/(app|db|deploy|docs|scripts|storage|tests)(/|$)">
    Require all denied
</LocationMatch>
# Replace the HTTPS host's existing CustomLog with these two scoped log lines.
SetEnvIf Request_URI "^/ch/admin\.php$" cosmos_admin_request
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" cosmos_preview_admin_safe
CustomLog ${APACHE_LOG_DIR}/thainews.aberg.online-access.log combined env=!cosmos_admin_request
CustomLog ${APACHE_LOG_DIR}/thainews.aberg.online-access.log cosmos_preview_admin_safe env=cosmos_admin_request
