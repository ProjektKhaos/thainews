# Cosmos House landing page, staff administration and protected English preview.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cosmoshouse.online
    ServerAlias www.cosmoshouse.online
    DocumentRoot /var/www/abergonline/thainews/ch
    DirectoryIndex public.php index.php

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/cosmoshouse.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cosmoshouse.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/abergonline/thainews/ch>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        php_admin_flag display_errors Off
        php_admin_value upload_max_filesize 8M
        php_admin_value post_max_size 10M
        php_admin_value memory_limit 256M
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.cosmoshouse\.online$ [NC]
    RewriteRule ^ https://cosmoshouse.online%{REQUEST_URI} [R=301,L,NE]
    RewriteCond %{REQUEST_URI} !^/$
    RewriteCond %{REQUEST_URI} !^/index\.html$
    RewriteCond %{REQUEST_URI} !^/(?:admin|public|media|login|booking_api)\.php$
    RewriteCond %{REQUEST_URI} !^/photos/photo-0[1-8]\.webp$
    RewriteCond %{REQUEST_URI} !^/assets/(?:admin\.css|admin\.js|style\.css|app\.js|booking\.js|photos/photo-(?:0[1-9]|[12][0-9]|3[0-8])\.webp|flags/(?:gb|se|th)\.svg)$
    RewriteCond %{REQUEST_URI} !^/en(?:/(?:house|gallery|experience|location|book))?(?:/index\.php|/)?$
    RewriteRule ^ - [F,L]
    RewriteRule ^/?(?:index\.html)?$ /public.php [END]

    <LocationMatch "(?i)^/(app|db|deploy|docs|scripts|storage|tests)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)(^|/)\.(?!well-known(?:/|$))">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)\.(zip|tar|gz|md|sqlite|db|sql|env|ini|log|lock)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)^(access|config|page-source|translations|booking_widget|admin_bookings|admin_extra)\.php$">
        Require all denied
    </FilesMatch>

    Header always set Strict-Transport-Security "max-age=15552000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By

    # Keep setup tokens and guest search strings out of access logs.
    SetEnvIf Request_URI "^/admin\.php$" cosmos_admin_request
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" cosmos_admin_safe
    ErrorLog ${APACHE_LOG_DIR}/cosmoshouse.online-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/cosmoshouse.online-ssl-access.log combined env=!cosmos_admin_request
    CustomLog ${APACHE_LOG_DIR}/cosmoshouse.online-ssl-access.log cosmos_admin_safe env=cosmos_admin_request
</VirtualHost>
</IfModule>
