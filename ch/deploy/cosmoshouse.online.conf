# Cosmos House: HTTP omdirigeras till HTTPS; ACME-vägen används för certifikatförnyelse.
<VirtualHost *:80>
    ServerName cosmoshouse.online
    ServerAlias www.cosmoshouse.online
    DocumentRoot /var/www/abergonline/thainews/ch
    DirectoryIndex index.html

    <Directory /var/www/abergonline/thainews/ch>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # ACME måste kunna hämtas över HTTP även när resten omdirigeras till HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$
    RewriteRule ^ https://cosmoshouse.online%{REQUEST_URI} [R=301,L,NE]

    # Källkod, tester, dokument och privat lagring får aldrig serveras direkt.
    <LocationMatch "(?i)^/(app|db|deploy|docs|scripts|storage|tests)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)(^|/)\.(?!well-known(?:/|$))">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)\.(zip|md|sqlite|db|sql|env|ini|log|lock)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)^(access|config|page-source|translations|booking_widget|admin_bookings|admin_extra)\.php$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/cosmoshouse.online-error.log
    CustomLog ${APACHE_LOG_DIR}/cosmoshouse.online-access.log combined
</VirtualHost>
