<VirtualHost *:80>
    ServerName thainews.aberg.online
    DocumentRoot /var/www/abergonline/thainews

    <Directory /var/www/abergonline/thainews>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://thainews.aberg.online%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/thainews.aberg.online-error.log
    CustomLog ${APACHE_LOG_DIR}/thainews.aberg.online-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName thainews.aberg.online
    DocumentRoot /var/www/abergonline/thainews
    DirectoryIndex index.php
    SetEnv THAI_NEWS_CONFIG_FILE /etc/thainews/config.php

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/thainews.aberg.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/thainews.aberg.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/abergonline/thainews>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    <LocationMatch "(?i)^/(app|includes|cron|sql|storage|tests|test-results|playwright-report|vendor|docs|node_modules|scripts|deploy)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)(^|/)\.(?!well-known(?:/|$))">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)^(\.|composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|playwright\.config\.js|.*\.(sql|md|env|ini|log|lock))$">
        Require all denied
    </FilesMatch>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always unset X-Powered-By

    <LocationMatch "^/(assets|img)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/thainews.aberg.online-error.log
    CustomLog ${APACHE_LOG_DIR}/thainews.aberg.online-access.log combined
</VirtualHost>
</IfModule>
